services:
  backend:
    build:
      context: .
      dockerfile: PortfolioIntelligencePlatform.Api/Dockerfile

    container_name: portfolio-api-container

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AlphaVantage__BaseUrl: https://www.alphavantage.co
      AlphaVantage__ApiKey: ${ALPHA_VANTAGE_API_KEY}

  frontend:
    build:
      context: ./portfolio-intelligence-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        
    container_name: portfolio-frontend-container

    ports:
      - "3000:80"

    depends_on:
      - backend